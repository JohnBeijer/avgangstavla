function minsLabel(m){
  if(m < 60) return {txt:`${m} min`,cls:'urgent'};
  if(m < 180) return {txt:`${Math.round(m/60*10)/10} tim`,cls:'warn'};
  return {txt:`${Math.round(m/60*10)/10} tim`,cls:'ok'};
}

function buildTable(){
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  
  // Sort LO rows within each group: Anskaffning always first
  raw.forEach(dep => {
    dep.grps.forEach(g => {
      g.los.sort((a,b) => {
        if(a.otype === b.otype) return 0;
        return a.otype === 'Anskaffning' ? -1 : 1;
      });
    });
  });

  raw.forEach(dep => {
    const ml = minsLabel(dep.mins);
    
    // Filter grps based on current filter
    const filteredGrps = dep.grps.filter(g => {
      if(currentFilter === 'all') return true;
      if(currentFilter === 'Filialorder') return g.los.some(l=>l.otype==='Filialorder');
      if(currentFilter === 'Anskaffning') return g.los.some(l=>l.otype==='Anskaffning');
      return g.grp.includes(currentFilter);
    });
    
    if(filteredGrps.length === 0) return;
    
    // Count total LO for this dep after filter
    const totalFiltered = filteredGrps.reduce((s,g)=>s+g.count,0);
    
    // Dep header row (spans all columns)
    const hdrRow = document.createElement('tr');
    hdrRow.className = 'dep-hdr';
    hdrRow.innerHTML = `
      <td colspan="6" style="padding:8px">
        <span class="dep-name">${dep.dep}</span>
        <span class="dep-time">${dep.time}</span>
        <span class="dep-mins ${ml.cls}" style="margin-left:8px">${ml.txt}</span>
        <span class="count-badge">${totalFiltered} LO kvar</span>
      </td>`;
    tbody.appendChild(hdrRow);
    
    // LO rows grouped by picking group
    filteredGrps.forEach(grp => {
      const filteredLos = currentFilter === 'Filialorder' ? grp.los.filter(l=>l.otype==='Filialorder')
        : currentFilter === 'Anskaffning' ? grp.los.filter(l=>l.otype==='Anskaffning')
        : grp.los;
      
      filteredLos.forEach((lo, i) => {
        const row = document.createElement('tr');
        row.dataset.grp = grp.grp;
        row.dataset.otype = lo.otype;
        row.innerHTML = `
          <td style="padding-left:20px">${i===0 ? `<span class="grp-badge" style="${grpStyle(grp.grp)}">${grp.grp}${grp.count>grp.los.length?` (${grp.count})`:''}</span>` : ''}</td>
          <td style="padding-left:20px">${i===0 && filteredLos.length > 1 ? '' : ''}<span class="lo-num">${lo.lo}</span></td>
          <td><span class="ko-num">${lo.ko}</span></td>
          <td><span class="${lo.otype==='Filialorder'?'type-fil':'type-ansk'}">${lo.otype==='Filialorder'?'FIL':'ANSK'}</span></td>
          <td class="right" style="color:#555">${lo.mod}</td>`;
        // Fix: move grp badge to first col correctly
        row.cells[0].innerHTML = i === 0 ? `<span style="padding-left:12px" class="grp-badge" style="${grpStyle(grp.grp)}">${grp.grp}</span>` : '';
        if(i === 0) row.cells[0].innerHTML = `<span class="grp-badge" style="${grpStyle(grp.grp)};margin-left:12px">${grp.grp}${grp.count>grp.los.length?' +':''}${grp.count>grp.los.length?(grp.count-grp.los.length)+'':''}</span>`;
        tbody.appendChild(row);
      });
      
      if(grp.count > filteredLos.length){
        const mRow = document.createElement('tr');
        mRow.className = 'more-row';
        mRow.innerHTML = `<td colspan="6" style="padding-left:20px">... och ${grp.count - filteredLos.length} fler i ${grp.grp}</td>`;
        tbody.appendChild(mRow);
      }
    });
  });
}

function setFilter(f, btn){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildTable();
}

function grpStyle(g){
  if(g.startsWith('Autostore'))return'background:#1a3a5c;color:#85B7EB';
  if(g.includes('PLOCKTRUCK'))return'background:#1a3a1a;color:#97C459';
  if(g.includes('SKJUTSTATIV'))return'background:#3a2a0a;color:#FAC775';
  if(g.includes('LISTER'))return'background:#3a1a2a;color:#ED93B1';
  if(g.includes('MOTVIKT'))return'background:#2a2a3a;color:#AFA9EC';
  return'background:#2a2a2a;color:#888';
}

buildTable();
